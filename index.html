<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 400px;
      position: relative;
      z-index: 2;
    }

    .slideshow {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    p { font-size: 1.1rem; margin-bottom: 30px; }

    button {
      font-size: 1rem;
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover { transform: scale(1.05); }

    .yes { background: #fff; color: #ff4d6d; }

    .no {
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      position: relative;
    }

    .hidden { display: none; }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="card">

    <div class="slideshow">
      <img id="slideImg" src="her1.jpg" alt="Gappu" />
    </div>

    <h1>Hey Gappu ❤️</h1>
    <p>Every moment with you feels special…</p>
    <h2>Will you be my Valentine?</h2>

    <div id="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div id="response" class="hidden">
      <h2>Yayyyy! 💕</h2>
      <p>You just made my heart very, very happy.</p>
    </div>

  </div>

  <script>
    // Slideshow
    const photos = ["her1.jpg", "her2.jpg", "her3.jpg"];
    let index = 0;
    const slideImg = document.getElementById("slideImg");

    setInterval(() => {
      index = (index + 1) % photos.length;
      slideImg.src = photos[index];
    }, 2000);

    // Running No button
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('click', moveButton);

    function moveButton() {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Yes click
    function sayYes() {
      document.getElementById('buttons').classList.add('hidden');
      document.getElementById('response').classList.remove('hidden');
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 400);

  </script>

</body>
</html>
