<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('background.jpg') no-repeat center center/cover;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-width: 450px;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(6px);
    }

    .slideshow {
      width: 230px;
      height: 230px;
      margin: 0 auto 25px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 { font-size: 2.4rem; margin-bottom: 15px; }

    .movie-text {
      font-size: 1.3rem;
      min-height: 60px;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .question {
      font-size: 1.8rem;
      margin-bottom: 25px;
      min-height: 60px;
      font-weight: bold;
    }

    button {
      font-size: 1rem;
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.5s ease;
      opacity: 0;
    }

    button.show {
      opacity: 1;
    }

    button:hover { transform: scale(1.05); }

    .yes { background: #fff; color: #ff4d6d; }

    .no {
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      position: relative;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: float 6s linear infinite;
      opacity: 0.8;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.6); opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="card">

    <div class="slideshow">
      <img id="slideImg" src="her1.jpg" alt="Gappu" />
    </div>

    <h1>Hey Gappu ❤️</h1>

    <div class="movie-text" id="line1"></div>
    <div class="question" id="line2"></div>

    <div id="buttons">
      <button class="yes" id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div id="response" style="display:none; font-size:1.8rem; margin-top:20px;">
      I knew what you would select ❤️
    </div>

  </div>

  <script>
    // Slideshow
    const photos = ["her1.jpg", "her2.jpg", "her3.jpg"];
    let index = 0;
    const slideImg = document.getElementById("slideImg");

    setInterval(() => {
      index = (index + 1) % photos.length;
      slideImg.src = photos[index];
    }, 2000);

    // Movie typing effect
    const line1Text = "Every moment with you feels special...";
    const line2Text = "Will you be my Valentine?";

    function typeText(text, element, speed, callback) {
      let i = 0;
      const interval = setInterval(() => {
        element.innerHTML += text.charAt(i);
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          if (callback) callback();
        }
      }, speed);
    }

    const line1 = document.getElementById("line1");
    const line2 = document.getElementById("line2");

    setTimeout(() => {
      typeText(line1Text, line1, 40, () => {
        setTimeout(() => {
          typeText(line2Text, line2, 60, () => {
            document.getElementById('yesBtn').classList.add('show');
            document.getElementById('noBtn').classList.add('show');
          });
        }, 800);
      });
    }, 800);

    // Running No button
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('click', moveButton);

    function moveButton() {
      const x = Math.random() * 250 - 125;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Yes click
    function sayYes() {
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('response').style.display = 'block';
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 400);

  </script>

</body>
</html>
